# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/messaging/webserver.pid;
error_log /var/log/sdkwork/messaging/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name messaging-demo.sdkwork.com messaging-demo.birdcoder.com messaging-demo.dtupay.com messaging-demo.noaper.com messaging-demo.sdkwork.cn messaging-demo.birdcoder.cn messaging-demo.dtupay.cn messaging-demo.noaper.cn messaging-demo.skubc.com messaging-demo.skubc.cn messaging-demo.zowalk.com messaging-demo.zowalk.cn messaging-demo.offer86.com messaging-demo.offer86.cn messaging-demo.86offer.com messaging-demo.86offer.cn;
        include snippets/gateway-api-locations.nonproduction.conf;
        location / {
            root /usr/share/sdkwork/messaging/web/pc;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
