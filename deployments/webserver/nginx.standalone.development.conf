# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/messaging/webserver.pid;
error_log /var/log/sdkwork/messaging/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:3900;
    }
    server {
        listen 80;
        server_name messaging-dev.sdkwork.com messaging-dev.birdcoder.com messaging-dev.dtupay.com messaging-dev.sdkwork.cn messaging-dev.birdcoder.cn messaging-dev.dtupay.cn messaging-dev.skubc.com messaging-dev.skubc.cn messaging-dev.zowalk.com messaging-dev.zowalk.cn messaging-dev.offer86.com messaging-dev.offer86.cn messaging-dev.86offer.com messaging-dev.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
