# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/messaging/webserver.pid;
error_log /var/log/sdkwork/messaging/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name messaging-staging.sdkwork.com messaging-staging.birdcoder.com messaging-staging.dtupay.com messaging-staging.sdkwork.cn messaging-staging.birdcoder.cn messaging-staging.dtupay.cn messaging-staging.skubc.com messaging-staging.skubc.cn messaging-staging.zowalk.com messaging-staging.zowalk.cn messaging-staging.offer86.com messaging-staging.offer86.cn messaging-staging.86offer.com messaging-staging.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
