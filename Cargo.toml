[workspace]
resolver = "2"
members = [
    "crates/sdkwork-messaging-database-host",
    "crates/sdkwork-messaging-delivery-service",
    "crates/sdkwork-messaging-delivery-repository-sqlx",
    "crates/sdkwork-routes-messaging-backend-api",
    "crates/sdkwork-api-messaging-assembly",
]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
sdkwork-messaging-database-host = { path = "crates/sdkwork-messaging-database-host" }
sdkwork-messaging-delivery-service = { path = "crates/sdkwork-messaging-delivery-service" }
sdkwork-routes-messaging-backend-api = { path = "crates/sdkwork-routes-messaging-backend-api" }
sdkwork-api-messaging-assembly = { path = "crates/sdkwork-api-messaging-assembly" }
axum = { version = "0.8", features = ["ws"] }
sdkwork-database-config = { path = "../sdkwork-database/crates/sdkwork-database-config", package = "sdkwork-database-config" }
sdkwork-database-lifecycle = { path = "../sdkwork-database/crates/sdkwork-database-lifecycle", package = "sdkwork-database-lifecycle" }
sdkwork-database-spi = { path = "../sdkwork-database/crates/sdkwork-database-spi", package = "sdkwork-database-spi" }
sdkwork-database-sqlx = { path = "../sdkwork-database/crates/sdkwork-database-sqlx", package = "sdkwork-database-sqlx" }
sdkwork-utils-rust = { path = "../sdkwork-utils/packages/sdkwork-utils-rust" }
sdkwork-web-core = { path = "../sdkwork-web-framework/crates/sdkwork-web-core" }
sdkwork-web-contract = { path = "../sdkwork-web-framework/crates/sdkwork-web-contract" }
sdkwork-web-axum = { path = "../sdkwork-web-framework/crates/sdkwork-web-axum" }
sdkwork-web-bootstrap = { path = "../sdkwork-web-framework/crates/sdkwork-web-bootstrap" }
sdkwork-iam-web-adapter = { path = "../sdkwork-iam/crates/sdkwork-iam-web-adapter" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "json", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
